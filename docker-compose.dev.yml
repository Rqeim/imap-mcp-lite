# Local development helper: runs the server with an ngrok tunnel so an MCP
# client can reach it over HTTPS. Redis is NOT started here — set REDIS_URL in
# .env to a reachable central instance.
services:
  imap-mcp-lite:
    build: .
    restart: unless-stopped
    environment:
      - AUTH_MODE=static
      - MCP_API_TOKEN=${MCP_API_TOKEN}
      - IMAP_HOST=${IMAP_HOST:-mail.privateemail.com}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USERNAME=${IMAP_USERNAME}
      - IMAP_APP_PASSWORD=${IMAP_APP_PASSWORD}
      - BASE_URL=${BASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-imap-mcp-lite:}
      - BIND_ADDR=0.0.0.0:8080
      - RUST_LOG=debug
    networks:
      - internal

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    # Free tier: random URL (check logs for the public URL)
    # Reserved domain: uncomment and set NGROK_DOMAIN in .env
    command: >
      http imap-mcp-lite:8080
      ${NGROK_DOMAIN:+--url=${NGROK_DOMAIN}}
    ports:
      - "4040:4040"
    networks:
      - internal

networks:
  internal:
