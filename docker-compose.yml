services:
  # Redis is not defined here on purpose: set REDIS_URL in .env to your
  # central/external instance.
  imap-mcp-lite:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - BIND_ADDR=0.0.0.0:8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imap-mcp-lite.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.imap-mcp-lite.entrypoints=websecure"
      - "traefik.http.routers.imap-mcp-lite.tls.certresolver=le"
      - "traefik.http.services.imap-mcp-lite.loadbalancer.server.port=8080"
    networks:
      - web

networks:
  web:
    external: true
